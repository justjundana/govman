name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify annotated SemVer tag
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]*)?$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go test -timeout=10m ./...
      - run: go test -race -timeout=10m ./...
      - run: bash test/installers.sh
      - uses: goreleaser/goreleaser-action@v7.2.1
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
